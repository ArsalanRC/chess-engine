name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      # standalone installs pnpm as a self-contained binary with its own Node,
      # so the toolchain does not impose a floor on the matrix. pnpm 11 needs
      # Node >= 22.13, but the package supports Node >= 18, and those are
      # different questions. Without this the matrix silently becomes a test of
      # what pnpm runs on rather than what the library runs on.
      - uses: pnpm/action-setup@v4
        with:
          standalone: true

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build
