name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Let a running deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # standalone installs pnpm as a self-contained binary with its own Node,
      # so the toolchain does not impose a floor on the matrix. pnpm 11 needs
      # Node >= 22.13, but the package supports Node >= 18, and those are
      # different questions. Without this the matrix silently becomes a test of
      # what pnpm runs on rather than what the library runs on.
      - uses: pnpm/action-setup@v4
        with:
          standalone: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The demo loads the compiled engine as plain ES modules, so the build
      # output is copied in beside it. No bundler involved.
      - run: pnpm run demo

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
